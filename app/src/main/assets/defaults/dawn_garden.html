<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dawn Garden</title>
<style>
html,body{margin:0;overflow:hidden;background:transparent;touch-action:none;user-select:none;-webkit-user-select:none;height:100%}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#dbg{position:fixed;left:8px;bottom:8px;width:130px;opacity:.6;touch-action:auto;z-index:9}
</style></head><body><canvas id="c"></canvas>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1,H=1,S=1,dpr=1;
var PI2=6.2832;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var R=rng(7781);
function sm(a,b,x){x=(x-a)/(b-a);x=x<0?0:x>1?1:x;return x*x*(3-2*x)}
function hx(h){return[parseInt(h.substr(1,2),16),parseInt(h.substr(3,2),16),parseInt(h.substr(5,2),16)]}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')'}
function P(n,d){return[hx(n),hx(d)]}
function mc(p,t){var a=p[0],b=p[1];return 'rgb('+((a[0]+(b[0]-a[0])*t)|0)+','+((a[1]+(b[1]-a[1])*t)|0)+','+((a[2]+(b[2]-a[2])*t)|0)+')'}
function ky(K,p,o){var i=0;while(i<K.length-2&&p>K[i+1][0])i++;var a=K[i],b=K[i+1],t=sm(a[0],b[0],p);for(var j=0;j<3;j++)o[j]=a[1][j]+(b[1][j]-a[1][j])*t}
var KT=[[0,hx('#1c2350')],[.45,hx('#5a5f9c')],[.75,hx('#9fc3e0')],[1,hx('#cfe8f2')]];
var KB=[[0,hx('#454a86')],[.45,hx('#e0a0a8')],[.75,hx('#ffd8b4')],[1,hx('#fff0d2')]];
var cT=[0,0,0],cB=[0,0,0];
var cFar=P('#3a3f7a','#b4d2c8'),cMid=P('#2e3a68','#9ac7a4'),cNear=P('#27335c','#82b78c'),cGnd=P('#1f2c52','#6aa578'),
cGrass=P('#2b3c66','#7db98a'),cStem=P('#2a4058','#5f9c70'),cTrunk=P('#2b2644','#8c6b55'),cCan1=P('#2d4a63','#79bb86'),
cCan2=P('#3a5f72','#96cf9f'),cBlos=P('#8a3a58','#e2403a'),cCloud=P('#6a70b0','#ffffff');
var FC=['#ffc2d1','#ffe08a','#cbb5ea','#fff3e6'];

/* ---------- precomputed scenery ---------- */
var i,N=28,bx=[],by=[],br=[],bt=[];
for(i=0;i<N;i++){var ang=R()*PI2,dd=Math.sqrt(R());bx.push(Math.cos(ang)*dd*1.05);by.push(Math.sin(ang)*dd*.78-.1);br.push(.34+R()*.26);bt.push(dd*.62+R()*.08)}
var NB=30,lx=[],ly=[],lt=[];
for(i=0;i<NB;i++){var a2=R()*PI2,d2=Math.sqrt(R());lx.push(Math.cos(a2)*d2*1.0);ly.push(Math.sin(a2)*d2*.72-.1);lt.push(.6+R()*.3)}
var NS=40,sx=[],sy=[],sr=[],sp_=[];for(i=0;i<NS;i++){sx.push(R());sy.push(R()*.33);sr.push(.8+R()*.8);sp_.push(R()*6)}
var NC=3,clx=[],cly=[.41,.47,.53],clw=[],clv=[];for(i=0;i<NC;i++){clx.push(R());clw.push(.2+R()*.1);clv.push(.004+R()*.004)}
var NG=70,gx=[],gy=[],gh=[],gt=[],gp=[];for(i=0;i<NG;i++){gx.push(R());gy.push(.8+R()*.2);gh.push(.02+R()*.03);gt.push(.12+R()*.6);gp.push(R()*6)}
var NF=36,fx=[],fy=[],fh=[],ft=[],fc=[],fp=[],fhx=new Float32Array(NF),fhy=new Float32Array(NF),fa=new Float32Array(NF);
for(i=0;i<NF;i++){fx.push(.03+R()*.94);fy.push(.83+R()*.14);fh.push(.03+R()*.04);ft.push(.4+R()*.5);fc.push(FC[(R()*4)|0]);fp.push(R()*6)}
var NY=14,yx=[],yy=[],yp=[];for(i=0;i<NY;i++){yx.push(.08+R()*.84);yy.push(.56+R()*.34);yp.push(R()*6)}
var NM=24,mx=[],mv=[],mp=[];for(i=0;i<NM;i++){mx.push(.1+R()*.8);mv.push(.03+R()*.03);mp.push(R())}
var NR=5,rbY=[],rbV=[],rbO=[],rbS=[];for(i=0;i<NR;i++){rbY.push(.4+R()*.12);rbV.push(.012+R()*.01);rbO.push(R()*1.3);rbS.push(.7+R()*.6)}
var NT=4,tx=[.3,.7,.55,.2],ty=[.84,.9,.8,.93],tp=[0,1.7,3.1,4.6],tcol=['#ffd18a','#f7a8c4','#b9d4ff','#ffe9a0'];

/* ---------- state ---------- */
var tgt=0,mid=0,cur=0,T=0,last=0,raf=0,paused=false,readyDone=false,theme='',pulse=0,lastM=0;
var rg=[],rx=new Float32Array(12),ry=new Float32Array(12),ra=new Float32Array(12).fill(9);
var NP=48,px=new Float32Array(NP),py=new Float32Array(NP),pvx=new Float32Array(NP),pvy=new Float32Array(NP),pl=new Float32Array(NP),pr=new Float32Array(NP);
var CX=0,CY=0,CR=0;

function spawn(x,y,n,spread){
  for(var k=0;k<NP&&n>0;k++)if(pl[k]<=0){px[k]=x+(Math.random()-.5)*spread;py[k]=y+(Math.random()-.5)*spread*.6;pvx[k]=(Math.random()-.5)*20;pvy[k]=10+Math.random()*14;pl[k]=3+Math.random()*2;pr[k]=Math.random()*6;n--}
}
function hill(base,amp,f,ph,col){
  ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);
  for(var k=0;k<=20;k++){var x=W*k/20;ctx.lineTo(x,base+amp*(Math.sin(x/W*f*PI2+ph)+.4*Math.sin(x/W*f*14+ph*2)))}
  ctx.lineTo(W,H);ctx.closePath();ctx.fill();
}
function applyTheme(lum,force){
  var n=theme;
  if(lum>.58)n='dark';else if(lum<.5)n='light';
  if(!n)n=lum>.54?'dark':'light';
  if(n!==theme||force){theme=n;if(window.ZikrHost&&ZikrHost.setTextTheme)ZikrHost.setTextTheme(n)}
}

function draw(p,dt){
  var d=sm(0,.85,p),k,t=T,x,y,a;
  ky(KT,p,cT);ky(KB,p,cB);
  var g=ctx.createLinearGradient(0,0,0,H*.66);
  g.addColorStop(0,rgb(cT));g.addColorStop(1,rgb(cB));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  applyTheme((.2126*(cT[0]*.75+cB[0]*.25)+.7152*(cT[1]*.75+cB[1]*.25)+.0722*(cT[2]*.75+cB[2]*.25))/255);

  // stars
  a=.45*(1-sm(.12,.5,p));
  if(a>.01){ctx.fillStyle='#dfe6ff';for(k=0;k<NS;k++){ctx.globalAlpha=a*(.55+.45*Math.sin(t*.7+sp_[k]));ctx.beginPath();ctx.arc(sx[k]*W,sy[k]*H,sr[k],0,PI2);ctx.fill()}ctx.globalAlpha=1}

  // sun
  var rise=sm(.1,.85,p),sxp=W*.74,syp=H*(.70-.23*rise),sr2=.22*S;
  var sg=ctx.createRadialGradient(sxp,syp,0,sxp,syp,sr2);
  var ga=.14+.4*rise;
  sg.addColorStop(0,'rgba(255,218,165,'+ga+')');sg.addColorStop(1,'rgba(255,218,165,0)');
  ctx.fillStyle=sg;ctx.fillRect(sxp-sr2,syp-sr2,sr2*2,sr2*2);
  ctx.fillStyle='#fff0cf';ctx.globalAlpha=.55+.4*rise;ctx.beginPath();ctx.arc(sxp,syp,.05*S*(1+.02*Math.sin(t*.8)),0,PI2);ctx.fill();ctx.globalAlpha=1;

  // clouds
  ctx.fillStyle=mc(cCloud,d);ctx.globalAlpha=.3+.3*d;ctx.beginPath();
  for(k=0;k<NC;k++){x=((clx[k]+t*clv[k])%1.5-.25)*W;y=cly[k]*H;var w=clw[k]*W;
    ctx.moveTo(x+w*.5,y);ctx.ellipse(x,y,w*.5,w*.1,0,0,PI2);
    ctx.moveTo(x+w*.28,y-w*.08);ctx.ellipse(x-w*.1,y-w*.08,w*.25,w*.1,0,0,PI2)}
  ctx.fill();ctx.globalAlpha=1;

  // hills
  hill(.58*H,.035*H,.9,.5,mc(cFar,d));
  hill(.64*H,.03*H,1.3,2.1,mc(cMid,d));
  hill(.71*H,.025*H,.8,4,mc(cNear,d));
  hill(.79*H,.01*H,1.2,1,mc(cGnd,d));

  // tree
  var sc=.15+.85*sm(.05,.62,p),by0=H*.815,trH=.14*S*sc,topY=by0-trH,rr=.1*S*sc;
  CX=W*.5;CY=topY-.025*S*sc;CR=rr;
  ctx.fillStyle='rgba(20,30,50,.1)';ctx.beginPath();ctx.ellipse(CX,by0+.005*S,.12*S*sc,.014*S,0,0,PI2);ctx.fill();
  var tw=.012*S*(.5+.5*sc);
  ctx.fillStyle=mc(cTrunk,d);ctx.beginPath();ctx.moveTo(CX-tw,by0);ctx.lineTo(CX+tw,by0);ctx.lineTo(CX+tw*.45,topY);ctx.lineTo(CX-tw*.45,topY);ctx.closePath();ctx.fill();
  for(var pass=0;pass<2;pass++){
    ctx.fillStyle=mc(pass?cCan2:cCan1,d);ctx.beginPath();
    for(k=pass;k<N;k+=2){a=sm(bt[k],bt[k]+.14,p);if(a<.01)continue;
      x=CX+bx[k]*rr+Math.sin(t*.5+k*.7)*.006*S*sc;y=CY+by[k]*rr;var r=br[k]*rr*a;ctx.moveTo(x+r,y);ctx.arc(x,y,r,0,PI2)}
    ctx.fill();
  }
  ctx.fillStyle=mc(cBlos,d);ctx.beginPath();
  for(k=0;k<NB;k++){a=sm(lt[k],lt[k]+.08,p);if(a<.01)continue;
    x=CX+lx[k]*rr*1.05+Math.sin(t*.5+k)*.004*S;y=CY+ly[k]*rr;var rb=.011*S*a*sc;ctx.moveTo(x+rb,y);ctx.arc(x,y,rb,0,PI2)}
  ctx.fill();

  // grass
  ctx.fillStyle=mc(cGrass,d);ctx.beginPath();
  for(k=0;k<NG;k++){a=sm(gt[k],gt[k]+.1,p);if(a<.02)continue;x=gx[k]*W;y=gy[k]*H;var h=gh[k]*S*a,sw=Math.sin(t*.9+gp[k])*.006*S;
    ctx.moveTo(x-3,y);ctx.lineTo(x-4+sw,y-h*.8);ctx.lineTo(x,y);
    ctx.moveTo(x-2,y);ctx.lineTo(x+sw,y-h);ctx.lineTo(x+2,y);
    ctx.moveTo(x,y);ctx.lineTo(x+4+sw,y-h*.75);ctx.lineTo(x+3,y)}
  ctx.fill();
  // rabbit
  a=sm(.7,.88,p);
  if(a>.01){var kk=.035*S*(.7+.3*a),rx0=W*.24,ry0=H*.9;ctx.globalAlpha=a;ctx.fillStyle='#f3e6d9';
    ctx.beginPath();ctx.ellipse(rx0,ry0-kk*.6,kk,kk*.7,0,0,PI2);ctx.fill();
    ctx.beginPath();ctx.arc(rx0+kk*.9,ry0-kk*1.15,kk*.5,0,PI2);ctx.fill();
    var tw2=Math.sin(t*1.3)>.92?.25:0;
    ctx.beginPath();ctx.ellipse(rx0+kk*.8,ry0-kk*1.95,kk*.17,kk*.5,-.2+tw2,0,PI2);ctx.fill();
    ctx.beginPath();ctx.ellipse(rx0+kk*1.05,ry0-kk*1.95,kk*.17,kk*.5,.15,0,PI2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(rx0-kk,ry0-kk*.7,kk*.28,0,PI2);ctx.fill();
    ctx.fillStyle='#5a4a52';ctx.beginPath();ctx.arc(rx0+kk*1.15,ry0-kk*1.2,kk*.07,0,PI2);ctx.fill();ctx.globalAlpha=1}

  // halo + golden motes (finish)
  var fin=sm(.85,1,p);pulse*=Math.exp(-dt/.9);
  var ha=fin*.2+pulse*.12;
  if(ha>.005){var hg=ctx.createRadialGradient(CX,CY,0,CX,CY,.24*S);hg.addColorStop(0,'rgba(255,236,170,'+ha+')');hg.addColorStop(1,'rgba(255,236,170,0)');
    ctx.fillStyle=hg;ctx.fillRect(CX-.24*S,CY-.24*S,.48*S,.48*S)}
  if(fin>.01){ctx.fillStyle='#fff3c4';for(k=0;k<NM;k++){var fr=(t*mv[k]+mp[k])%1;x=mx[k]*W+Math.sin(t*.4+mp[k]*9)*.03*W;y=H*.9-fr*H*.42;
    ctx.globalAlpha=Math.sin(fr*3.1416)*fin*.7;ctx.beginPath();ctx.arc(x,y,.004*S+1,0,PI2);ctx.fill()}ctx.globalAlpha=1}

  // birds
  a=sm(.62,.8,p);
  if(a>.01){ctx.globalAlpha=a*.75;ctx.strokeStyle='#5e6f95';ctx.lineWidth=1.8;ctx.beginPath();
    for(k=0;k<NR;k++){x=((t*rbV[k]+rbO[k])%1.3-.15)*W;y=rbY[k]*H+Math.sin(t*.5+k)*.01*H;var s3=.018*S*rbS[k],fl2=Math.sin(t*3.5+k*2);
      ctx.moveTo(x-s3,y+fl2*s3*.5);ctx.quadraticCurveTo(x-s3*.4,y-s3*.35,x,y);ctx.quadraticCurveTo(x+s3*.4,y-s3*.35,x+s3,y+fl2*s3*.5)}
    ctx.stroke();ctx.globalAlpha=1}

  // petals
  ctx.fillStyle=mc(cCan2,d);ctx.globalAlpha=.85;ctx.beginPath();
  for(k=0;k<NP;k++){if(pl[k]<=0)continue;pl[k]-=dt;pr[k]+=dt*1.5;px[k]+=(pvx[k]+Math.sin(t*1.5+k)*12)*dt;py[k]+=pvy[k]*dt;
    if(py[k]>H*.97)pl[k]=0;var s4=Math.min(1,pl[k]);ctx.moveTo(px[k]+4*s4,py[k]);ctx.ellipse(px[k],py[k],4*s4,2.2*s4,pr[k],0,PI2)}
  ctx.fill();ctx.globalAlpha=1;

  // tap rings
  for(k=0;k<12;k++){if(ra[k]>=1.4)continue;ra[k]+=dt;var q=ra[k]/1.4;if(q>=1)continue;
    var e=1-(1-q)*(1-q),rd=.02*S+.1*S*e,al=.5*Math.pow(1-q,1.6);
    ctx.fillStyle='rgba(255,240,200,'+(al*.25)+')';ctx.beginPath();ctx.arc(rx[k],ry[k],rd*.7,0,PI2);ctx.fill();
    ctx.strokeStyle='rgba(255,245,215,'+al+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rx[k],ry[k],rd,0,PI2);ctx.stroke()}
}

function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  T+=dt;
  mid+=(tgt-mid)*(1-Math.exp(-dt/.11));cur+=(mid-cur)*(1-Math.exp(-dt/.11));
  if(Math.abs(tgt-cur)<1e-4){cur=tgt;mid=tgt}
  draw(cur,dt);
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth||360;H=window.innerHeight||720;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(H,W*1.9);
  if(readyDone&&paused)draw(cur,0);
}
function clamp(p){p=+p;return p>1?1:p>0?p:0}

window.zikrScene={
  init:function(p){p=clamp(p);tgt=mid=cur=p;lastM=p;draw(cur,0);applyTheme(0,true)},
  setProgress:function(p){
    p=clamp(p);var old=tgt;tgt=p;
    var ms=[.25,.5,.75,1];
    for(var k=0;k<4;k++)if(old<ms[k]-1e-6&&p>=ms[k]-1e-6){
      pulse=1.4;spawn(CX||W*.5,CY||H*.6,k===3?30:14,CR*2||80);
      if(window.ZikrHost&&ZikrHost.milestone)ZikrHost.milestone(ms[k]);
    }
  },
  tap:function(nx,ny){
    var s=0,k;for(k=0;k<12;k++){if(ra[k]>=1.4){s=k;break}if(ra[k]>ra[s])s=k}
    rx[s]=nx*W;ry[s]=ny*H;ra[s]=0;pulse=Math.min(pulse+.5,1.2);
    if(tgt>.5&&Math.random()<.5)spawn(CX,CY,1,CR*1.6);
  },
  setPaused:function(v){
    paused=!!v;
    if(paused){if(raf){cancelAnimationFrame(raf);raf=0}}
    else if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}
  }
};

window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){window.zikrScene.setPaused(document.hidden)});

if(!window.ZikrHost){
  var sl=document.createElement('input');sl.type='range';sl.min=0;sl.max=100;sl.value=0;sl.id='dbg';
  sl.addEventListener('input',function(){window.zikrScene.setProgress(sl.value/100)});
  document.body.appendChild(sl);
  cv.addEventListener('pointerdown',function(e){window.zikrScene.tap(e.clientX/W,e.clientY/H)});
}

resize();
draw(cur,0);
applyTheme(0,true);
if(window.ZikrHost&&ZikrHost.ready)ZikrHost.ready();
readyDone=true;
if(!paused){last=performance.now();raf=requestAnimationFrame(frame)}
})();
</script></body></html>
