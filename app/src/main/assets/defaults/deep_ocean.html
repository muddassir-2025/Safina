function draw(p,dt){
  var t=T,k,x,y,a,desc=sm(0,.9,p);

    var bg=ctx.createLinearGradient(0,sy0,0,sy0+H*.14);bg.addColorStop(0,'rgba(170,235,250,.3)');bg.addColorStop(1,'rgba(170,235,250,0)');ctx.fillStyle=bg;ctx.fillRect(0,sy0,W,H*.14);

    ctx.setLineDash([10,34]);ctx.lineDashOffset=-T*14;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=3.5;ctx.beginPath();for(k=0;k<=24;k++){if(k)ctx.lineTo(W*k/24,wy(W*k/24,0)-2);else ctx.moveTo(0,wy(0,0)-2)}ctx.stroke();ctx.setLineDash([])}

    ctx.lineCap='round';
    for(k=0;k<NK;k++){a=sm(kt[k],kt[k]+.15,p);if(a<.02)continue;x=kx[k]*W;y=hY(x,nb,.01*H,1.3,2.4)+3;var hh=kh[k]*S*a,s1=Math.sin(t*.7+kp[k])*.012*S,s2=Math.sin(t*.7+kp[k]+.8)*.016*S;

      ctx.lineWidth=.003*S+1;ctx.beginPath();ctx.moveTo(x+3,y);ctx.quadraticCurveTo(x+3+s1*.8,y-hh*.35,x+3+s2*.7,y-hh*.7);ctx.stroke()}
    ctx.strokeStyle='#2f9a68';ctx.lineWidth=1.5;ctx.beginPath();

      ctx.beginPath();for(b=-2;b<=2;b++){var cx2=x+b*ch*.28+Math.sin(t*.6+k+b)*.003*S,cy2=y-ch*(1-Math.abs(b)*.17);ctx.moveTo(cx2+.005*S+1,cy2);ctx.arc(cx2,cy2,.005*S+1,0,PI2)}ctx.fill()}

function frame(now){
  raf=requestAnimationFrame(frame);
  var dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  T+=dt;
  mid+=(tgt-mid)*(1-Math.exp(-dt/.11));cur+=(mid-cur)*(1-Math.exp(-dt/.11));
  if(Math.abs(tgt-cur)<1e-4){cur=tgt;mid=tgt}
  draw(cur,dt);
}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth||360;H=window.innerHeight||720;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);S=Math.min(H,W*1.9);
  if(readyDone&&paused)draw(cur,0);
}
function clamp(p){p=+p;return p>1?1:p>0?p:0}
function theme(){if(window.ZikrHost&&ZikrHost.setTextTheme)ZikrHost.setTextTheme('light')}

window.zikrScene={
  init:function(p){p=clamp(p);tgt=mid=cur=p;draw(cur,0);theme()},
  setProgress:function(p){

    for(var k=0;k<4;k++)if(old<ms[k]-1e-6&&p>=ms[k]-1e-6){
      pulse=1.4;if(k===3){spawnB(subX,subFY,10,.06*S);spawnDust(subX,subFY,12)}else spawnB(W*.5,H*.88,12,W*.6);
      if(window.ZikrHost&&ZikrHost.milestone)ZikrHost.milestone(ms[k]);
    }
  },
  tap:function(nx,ny){
    var s=0,k;for(k=0;k<8;k++){if(ra[k]>=1.6){s=k;break}if(ra[k]>ra[s])s=k}
    rx[s]=nx*W;ry[s]=ny*H;ra[s]=0;spawnB(nx*W,ny*H,3,.03*S);
  },
  setPaused:function(v){
    paused=!!v;
    if(paused){if(raf){cancelAnimationFrame(raf);raf=0}}
    else if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}
  }
};

window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',function(){window.zikrScene.setPaused(document.hidden)});

if(!window.ZikrHost){
  var sl2=document.createElement('input');sl2.type='range';sl2.min=0;sl2.max=100;sl2.value=0;sl2.id='dbg';
  sl2.addEventListener('input',function(){window.zikrScene.setProgress(sl2.value/100)});
  document.body.appendChild(sl2);
  cv.addEventListener('pointerdown',function(e){window.zikrScene.tap(e.clientX/W,e.clientY/H)});
}

resize();
draw(cur,0);
theme();
if(window.ZikrHost&&ZikrHost.ready)ZikrHost.ready();
readyDone=true;
if(!paused){last=performance.now();raf=requestAnimationFrame(frame)}
})();
