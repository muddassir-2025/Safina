<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Dots</title>
<style>html,body{margin:0;overflow:hidden;background:transparent;touch-action:none;user-select:none}canvas{display:block}#dbg{position:fixed;left:10px;bottom:10px;right:10px;display:none;font:12px sans-serif}#dbg input{width:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dbg"><input id="s" type="range" min="0" max="100" value="0"></div>
<script>
(function () {
  var c = document.getElementById("c"), ctx = c.getContext("2d"), W = 1, H = 1;
  var progress = 0, target = 0, paused = false, t0 = 0, dots = [];
  for (var i = 0; i < 40; i++) dots.push({ x: Math.random(), y: 0.4 + Math.random() * 0.55, r: 1 + Math.random() * 2, p: Math.random() });
  function resize() {
    var d = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    c.width = W * d; c.height = H * d; c.style.width = W + "px"; c.style.height = H + "px";
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  function draw(now) {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, progress > 0.5 ? "#274A57" : "#C9D8D4");
    g.addColorStop(1, progress > 0.5 ? "#0E2B36" : "#EAF1EC");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < dots.length; i++) {
      var d = dots[i];
      var a = Math.max(0, Math.min(1, (progress * 1.4) - d.p));
      if (a <= 0) continue;
      var y = d.y * H - Math.sin(now / 2200 + i) * 8;
      ctx.fillStyle = "rgba(255,255,255," + (0.7 * a) + ")";
      ctx.beginPath(); ctx.arc(d.x * W, y, d.r * a * 2, 0, 6.2832); ctx.fill();
    }
    if (progress > 0.6) {
      ctx.fillStyle = "rgba(255,215,140," + ((progress - 0.6) * 1.2) + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }
  function loop(now) {
    if (paused) return;
    if (!t0) t0 = now;
    var dt = Math.min(0.05, (now - t0) / 1000); t0 = now;
    progress += (target - progress) * Math.min(1, dt / 0.65);
    draw(now);
    requestAnimationFrame(loop);
  }
  window.zikrScene = {
    init: function (p) {
      progress = target = p || 0; draw(0);
      if (window.ZikrHost) {
        try { ZikrHost.setTextTheme(progress > 0.5 ? "dark" : "light"); ZikrHost.ready(); } catch (e) {}
      }
      requestAnimationFrame(loop);
    },
    setProgress: function (p) {
      target = Math.max(0, Math.min(1, p || 0));
      if (window.ZikrHost) { try { ZikrHost.setTextTheme(target > 0.5 ? "dark" : "light"); } catch (e) {} }
    },
    tap: function () {},
    setPaused: function (v) { paused = !!v; if (!paused) { t0 = 0; requestAnimationFrame(loop); } }
  };
  if (!window.ZikrHost) {
    var dbg = document.getElementById("dbg"); dbg.style.display = "block";
    document.getElementById("s").addEventListener("input", function (e) { target = e.target.value / 100; });
  }
  window.addEventListener("resize", resize);
  resize(); draw(0);
})();
</script>
</body>
</html>
